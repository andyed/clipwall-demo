<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clipwall</title>
<link rel="stylesheet" href="wall/wall.css">
<link rel="stylesheet" href="wall/attribute-brush.css">
  <link rel="stylesheet" href="wall/spatial/spatial.css">
</head>
<body>

<header class="bar">
  <div class="main-controls">
  <span class="brand">clipwall</span>
  <button class="btn" id="toggle-rail" type="button" aria-label="Filters">☰</button>
  <input class="search" id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search titles, notes, tags">
  <select class="select" id="group" aria-label="Group by"></select>
  <select class="select" id="sort-key" aria-label="Sort within groups"></select>
  <button class="btn" id="sort-direction" type="button" aria-label="Sort ascending">↑</button>
  <select class="select" id="attribute-lens" aria-label="Attribute lens"></select>
  <div class="zoomctl">
    <button class="btn" id="view-3d" type="button" aria-pressed="false" aria-label="Spatial view">3D</button>
    <button class="btn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button class="btn" id="zoom-fit" type="button" aria-label="Fit">⊡</button>
    <button class="btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button class="btn" id="showcase" type="button" aria-pressed="false" aria-label="Showcase: flow the collection through the visible slots">▶</button>
  </div>
  <select class="select pan-behavior" id="pan-behavior" aria-label="Pan behavior" hidden>
    <option value="free">Free pan</option>
    <option value="bounded">Bounded pan</option>
    <option value="edge">Edge zoom</option>
  </select>
  <button class="btn" id="copy-view" type="button" aria-label="Copy link">⎘</button>
  <span class="count" id="count" role="status" aria-live="polite"></span>
  </div>
</header>

<div id="link-status" role="status" hidden><span id="link-message"></span> <button class="btn" id="new-view" type="button">New view</button></div>

<nav class="rail" id="rail" aria-label="Filters"></nav>

<section id="scope-bar" class="scope-bar" aria-label="Working scope" hidden>
  <button class="btn" id="scope-back" type="button" aria-label="Back">‹</button>
  <div id="scope-summary"></div>
  <button class="btn" id="scope-clear" type="button" aria-label="All content">×</button>
</section>
<section id="context-clusters" class="context-clusters" aria-label="Alternate clusters outside the current scope" hidden>
  <div class="context-heading"><strong>Outside this scope</strong><span id="context-preview" role="status"></span></div>
  <div id="context-list"></div>
</section>

<main class="stage" id="stage">
  <div class="bg-plane" id="bg-plane" hidden></div>
  <div class="canvas" id="canvas"><div class="flow-plane" id="flow-plane" hidden></div></div>
  <div class="sp-host" id="sp-host" hidden></div>
  <div class="row-title" id="row-title" hidden>
    <button class="rt-focus" type="button"><strong></strong><span class="n"></span><span class="pos"></span></button>
    <button class="rt-next" type="button" aria-label="Next group">›</button>
  </div>
  <div class="review-tip" id="review-tip"></div>
  <span class="edge-feedback sr-only" id="edge-feedback" role="status"></span>
  <button class="btn edge-undo" id="edge-undo" type="button" hidden aria-label="Undo edge zoom">↶</button>
</main>

<aside class="detail" id="detail" aria-label="Clip detail"></aside>

<div class="empty hidden" id="empty"></div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="wall/wall.mjs"></script>
</body>
</html>
